name: Build and publish Docker image

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    outputs:
      image: ${{ steps.image_ref.outputs.image }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export immutable image reference
        id: image_ref
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="$(printf '%s\n' "$IMAGE_TAGS" | grep -v ':latest$' | head -n 1)"
          if [ -z "$image" ]; then
            echo "Could not determine the commit-tagged image" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare SSH key and verify VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          if ! ssh-keyscan -T 10 -p "$VPS_SSH_PORT" -t ed25519 "$VPS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null; then
            echo "::error::Could not scan the VPS Ed25519 host key."
            exit 1
          fi
          if [[ ! -s "$HOME/.ssh/known_hosts" ]]; then
            echo "::error::Could not retrieve the VPS Ed25519 host key."
            exit 1
          fi

          actual_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk 'NR == 1 {print $2}')"
          if [[ "$actual_fingerprint" != "$VPS_SSH_FINGERPRINT" ]]; then
            echo "::error::The VPS Ed25519 host key does not match VPS_SSH_FINGERPRINT. Received: $actual_fingerprint"
            exit 1
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy files and deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          FRONTEND_PORT: "8081"
        run: |
          set -euo pipefail
          ssh_key="$HOME/.ssh/deploy_key"
          known_hosts="$HOME/.ssh/known_hosts"

          scp -i "$ssh_key" -P "$VPS_SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -r docker-compose.yml frontend deploy-vps.sh \
            "$VPS_USERNAME@$VPS_HOST:/opt/auto-deploy/"

          {
            printf 'export GHCR_USER=%q\n' "$GHCR_USER"
            printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            printf 'export BACKEND_IMAGE=%q\n' "$IMAGE"
            printf 'export FRONTEND_PORT=%q\n' "$FRONTEND_PORT"
            printf '%s\n' 'exec bash /opt/auto-deploy/deploy-vps.sh'
          } | ssh -i "$ssh_key" -p "$VPS_SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            "$VPS_USERNAME@$VPS_HOST" 'bash -s'

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

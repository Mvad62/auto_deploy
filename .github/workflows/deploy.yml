name: Build and publish Docker image

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    outputs:
      image: ${{ steps.image_ref.outputs.image }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export immutable image reference
        id: image_ref
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="$(printf '%s\n' "$IMAGE_TAGS" | grep -v ':latest$' | head -n 1)"
          if [ -z "$image" ]; then
            echo "Could not determine the commit-tagged image" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Copy Compose file and frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: docker-compose.yml,frontend
          target: /opt/auto-deploy
          overwrite: true

      - name: Pull image and restart application
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          FRONTEND_PORT: "8081"
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE,FRONTEND_PORT
          script: |
            set -eu
            cd /opt/auto-deploy

            docker_config="$(mktemp -d)"
            export DOCKER_CONFIG="$docker_config"
            cleanup() {
              docker logout ghcr.io >/dev/null 2>&1 || true
              rm -rf "$docker_config"
            }
            trap cleanup EXIT

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            export BACKEND_IMAGE="$IMAGE"
            export FRONTEND_PORT
            docker compose pull backend
            docker compose up -d --no-build --remove-orphans

            attempt=0
            while [ "$attempt" -lt 30 ]; do
              if docker compose exec -T frontend wget -q -O- http://localhost/api/health | grep -q '"status":"healthy"'; then
                exit 0
              fi
              attempt=$((attempt + 1))
              sleep 2
            done

            docker compose ps
            docker compose logs --tail=100
            exit 1
